<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090b2b" />
  <title>Our Little Universe</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <main id="app" aria-live="polite">
    <section id="countdown-screen" class="screen sky-screen">
      <div class="stars" aria-hidden="true"></div>
      <div class="moon" aria-hidden="true"></div>
      <div class="screen-content">
        <p class="eyebrow">A little magic is waiting</p>
        <h1>Our Little Universe</h1>
        <p class="subtitle">Our story begins soon...</p>
        <div id="countdown" class="countdown" aria-label="شمارش معکوس">
          <div><strong id="days">00</strong><span>روز</span></div>
          <div><strong id="hours">00</strong><span>ساعت</span></div>
          <div><strong id="minutes">00</strong><span>دقیقه</span></div>
          <div><strong id="seconds">00</strong><span>ثانیه</span></div>
        </div>
        <button id="preview-entry" class="magic-button">ورود به داستان ✨</button>
        <p id="countdown-note" class="hint">شمارش معکوس تا ۱۹ اکتبر ۲۰۲۶، ساعت ۰۰:۰۰ به وقت ایران</p>
      </div>
    </section>

    <section id="gate-screen" class="screen gate-screen hidden">
      <div class="gate-glow"></div>
      <div class="screen-content">
        <p class="eyebrow">A secret awaits</p>
        <h2>Enter the secret</h2>
        <p class="subtitle">برای ورود، رمز جادویی را وارد کن.</p>
        <form id="password-form" class="password-form">
          <label for="password">رمز ورود</label>
          <input id="password" type="password" autocomplete="off" required />
          <button class="magic-button" type="submit">باز کردن دروازه</button>
          <p id="password-message" class="message" role="status"></p>
        </form>
      </div>
    </section>

    <section id="book-screen" class="screen book-screen hidden">
      <div class="book-shell">
        <div class="book-header">
          <span id="chapter-number">فصل ۱ از ۵</span>
          <button id="restart" class="text-button">شروع دوباره</button>
        </div>
        <article id="chapter-content" class="book-page"></article>
        <div class="book-navigation">
          <button id="previous" class="nav-button">قبلی</button>
          <button id="next" class="magic-button">بعدی</button>
        </div>
      </div>
    </section>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
